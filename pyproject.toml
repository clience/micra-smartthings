[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "micra-smartthings"
version = "0.3.3"
description = "Experimental Linea Micra bridge for SmartThings Edge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["pylamarzocco==2.5.6", "aiohttp>=3.12,<4"]

[project.urls]
Homepage = "https://github.com/clience/micra-smartthings"
Issues = "https://github.com/clience/micra-smartthings/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "PyYAML>=6,<7", "lupa>=2,<3"]

[project.scripts]
micra-bridge = "micra_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["micra_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
